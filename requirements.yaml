# Requirements Testing Strategy
#
# This project uses unit tests to verify requirements.
#
# Test links can include a source filter prefix (e.g. "windows@", "ubuntu@") to restrict
# which test results count as evidence for a requirement.
#
sections:
  - title: TestProject Requirements
    sections:
      - title: Application
        requirements:
          - id: TestProject-App-Greeting
            title: The application shall output a greeting message.
            justification: |
              Provides the core functionality of the TestProject application.
            tests:
              - TestMethod1

      - title: OTS Software
        requirements:
          - id: TestProject-OTS-MSTest
            title: MSTest shall execute unit tests and report results.
            justification: |
              MSTest (MSTest.TestFramework and MSTest.TestAdapter) is the unit-testing framework used
              by the project. It discovers and runs all test methods and writes TRX result files that
              feed into coverage reporting and requirements traceability. Passing tests confirm the
              framework is functioning correctly.
            tags: [ots]
            tests:
              - TestMethod1
